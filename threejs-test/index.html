<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Humanoid v10 · Three.js Preview</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">BLENDER HUMANOID / V10</p>
        <h1>Character inspection</h1>
      </div>
      <div class="actions">
        <button id="reset-view" type="button">Reset view</button>
        <button id="wireframe" type="button" aria-pressed="false">Wireframe</button>
      </div>
    </header>
    <section id="viewport" aria-label="Interactive 3D character preview">
      <div id="status" role="status">Loading humanoid_v10.glb…</div>
      <div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
    </section>
    <footer>
      <span>GLB preview · metres · static mesh test</span>
      <span id="model-info">Waiting for model…</span>
    </footer>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
